<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD Stickies</title>
<meta name="description" content="Apple's Stickies, rebuilt natively for macOS, with notes written in Markdown.">
<meta property="og:title" content="MD Stickies">
<meta property="og:description" content="Apple's Stickies, rebuilt natively for macOS, with notes written in Markdown.">
<meta property="og:image" content="https://odeinjul.github.io/stickies-reproduced/preview.png">
<link rel="icon" href="icon.png">
<style>
  :root {
    --paper: #faf8f3;
    --ink: #222220;
    --muted: #6b6a66;
    --rule: #e4e1d8;
    --button: #222220;
    --button-ink: #faf8f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1b1b1a;
      --ink: #ecebe6;
      --muted: #9a9993;
      --rule: #34332f;
      --button: #ecebe6;
      --button-ink: #1b1b1a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 680px; margin: 0 auto; padding: 72px 24px 48px; }
  header { display: flex; align-items: center; gap: 20px; }
  header img { width: 88px; height: 88px; flex: none; }
  h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 650; letter-spacing: -0.01em; }
  header p { margin: 6px 0 0; color: var(--muted); }
  .downloads { display: flex; flex-wrap: wrap; gap: 12px; margin: 36px 0 10px; }
  .downloads a {
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid var(--button);
    color: var(--ink);
    text-decoration: none;
    font-weight: 500;
  }
  .downloads a.primary { background: var(--button); color: var(--button-ink); }
  .meta { margin: 0; color: var(--muted); font-size: 14px; }
  .meta a { color: inherit; }
  figure { margin: 48px -24px; }
  figure img { display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--rule); }
  footer { margin-top: 8px; color: var(--muted); font-size: 14px; }
  footer a { color: inherit; }
  @media (min-width: 760px) { figure { margin-left: -60px; margin-right: -60px; } }
  @media (max-width: 560px) {
    main { padding-top: 48px; }
    header { align-items: flex-start; }
    header img { width: 64px; height: 64px; }
    h1 { font-size: 28px; }
    figure { margin: 36px 0; }
  }
</style>
</head>
<body>
<main>
  <header>
    <img src="icon.png" alt="">
    <div>
      <h1>MD Stickies</h1>
      <p>Apple's Stickies, rebuilt natively for macOS, with notes written in Markdown.</p>
    </div>
  </header>

  <div class="downloads">
    <a class="primary" href="https://github.com/odeinjul/stickies-reproduced/releases/download/v0.1.1/StickiesMD-0.1.1-AppleSilicon.zip">Download for Apple silicon</a>
    <a href="https://github.com/odeinjul/stickies-reproduced/releases/download/v0.1.1/StickiesMD-0.1.1-Intel.zip">Intel</a>
    <a href="https://github.com/odeinjul/stickies-reproduced">Source</a>
  </div>
  <p class="meta">Version 0.1.1 · macOS 13 or later · Free, <a href="https://github.com/odeinjul/stickies-reproduced/blob/main/LICENSE">MIT licensed</a></p>

  <figure>
    <img src="preview.png" width="1740" height="1016" alt="Four notes on a desktop: a yellow welcome note in front of a blue one, a green note with a checklist, and a collapsed purple note.">
  </figure>

  <footer>
    Made by <a href="https://github.com/odeinjul">@odeinjul</a> with Claude Opus 5.5. Not affiliated with Apple.
  </footer>
</main>
</body>
</html>
